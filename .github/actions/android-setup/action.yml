name: Android setup
description: JDK 21 for Gradle, JDK 17 for the Kotlin toolchain, and (unless turned off) a cached Gradle home.

inputs:
  cache:
    description: >-
      "false" starts from an empty Gradle home and saves nothing. The release build uses that: a restored Gradle home
      (compiled build scripts, transforms, the extracted wrapper) isn't covered by dependency verification, and any
      job on main can write the cache.
    default: "true"

runs:
  using: composite
  steps:
    # The last version listed becomes JAVA_HOME (Gradle runs on 21). Both stay visible as JAVA_HOME_<v>_X64.
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: |
          17
          21
    # Also validates the Gradle wrapper jar against the published checksums.
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        cache-disabled: ${{ inputs.cache != 'true' }}
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Point Gradle at the installed JDKs
      shell: bash
      run: |
        mkdir -p ~/.gradle
        {
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64"
          echo "org.gradle.java.installations.auto-download=false"
          # Hosted runners have 4 cores and 16 GB.
          echo "org.gradle.workers.max=4"
        } >> ~/.gradle/gradle.properties
