# Tests for pull requests and feature branches. release.yml also calls this before publishing from main.
#
# These jobs hold no secrets, so they may use caches (Gradle home, NuGet, buildx). Runs on main write the caches every
# other run can read, so the release jobs that publish or sign never restore them. Actions are pinned to commit SHAs
# (tag in the comment): a tag can be moved to different code, a commit can't.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or PR cancels the older run. When release.yml calls this, github.workflow is
  # "Release", so it gets its own group, and runs on main are never cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: goldfish
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      GF_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=root;Password=test;Database=goldfish"
      GF_TEST_REDIS: "127.0.0.1:6379"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: server/**/packages.lock.json
      - name: Restore
        run: dotnet restore GoldfishSend.slnx --locked-mode
      - name: Check formatting
        run: dotnet format GoldfishSend.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build GoldfishSend.slnx -c Release --no-restore
      - name: Test
        run: dotnet test GoldfishSend.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-test-results
          path: server/TestResults
          retention-days: 7

  server-load:
    name: Server load test (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: goldfish_load
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: server/**/packages.lock.json
      - name: Build
        run: |
          dotnet build -c Release src/GoldfishSend.Api
          dotnet build -c Release tools/LoadTest
      - name: Run the smoke load test
        # About a minute: a server with the load-test settings (tools/LoadTest/server.env) and a short, modest load.
        run: |
          api=src/GoldfishSend.Api/bin/Release/net10.0
          Goldfish__Keys__ServerKey="$(dotnet $api/GoldfishSend.Api.dll keygen 2>/dev/null | jq -r .Goldfish.Keys.ServerKey)"
          export Goldfish__Keys__ServerKey
          export ConnectionStrings__MySql='Server=127.0.0.1;Port=3306;User=root;Password=test;Database=goldfish_load'
          export ConnectionStrings__Redis='127.0.0.1:6379,defaultDatabase=2'
          export ConnectionStrings__RedisEphemeral='127.0.0.1:6379,defaultDatabase=3'
          env $(grep -v '^#' tools/LoadTest/server.env | xargs) \
            dotnet $api/GoldfishSend.Api.dll --contentRoot "$PWD/$api" --urls http://127.0.0.1:5299 > server.log 2>&1 &
          server=$!
          status=0
          dotnet run --project tools/LoadTest -c Release --no-build -- \
            --url http://127.0.0.1:5299 --smoke --json loadtest.json || status=$?
          kill $server
          exit $status
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-load-test
          path: |
            server/loadtest.json
            server/server.log
          retention-days: 14

  server-image:
    name: Server image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Unit tests, lint and builds
        # The release build is unsigned here; it checks R8 and resource shrinking.
        run: >-
          ./gradlew --stacktrace
          :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Compile the baseline-profile generator and benchmarks
        # Compile only: generating profiles and benchmarking need a device (see android/README.md, "Baseline profiles").
        run: ./gradlew --stacktrace :app:compileBenchmarkReleaseKotlin :baselineprofile:compileBenchmarkReleaseKotlin
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          retention-days: 7

  android-device:
    name: Android device tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs
        working-directory: android
        run: ./gradlew -Pgf.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # AGP reports success when the APK fails to install (no tests run), so check that tests actually ran.
          script: |
            ./gradlew -Pgf.abis=x86_64 :app:connectedDebugAndroidTest
            grep -rqs '<testcase' app/build/outputs/androidTest-results/connected || (echo "::error::No device tests ran." && exit 1)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 7
