# ======================================================================================
# GoldfishSend EPHEMERAL Redis: rate-limit buckets and their HMAC keys, PoW challenges and load
# counters, idempotency markers, the gateway replay cache, mailbox leases and push-host circuit
# breakers (and the epoch keys, with Goldfish:EpochKeyStore=Ephemeral).
#
# This instance must NEVER persist. Its write stream (rate-limit SETs for hashed client
# addresses) would otherwise amount to an activity log. AOF and RDB are both off and it has
# no volume. Restarting it resets the limits (and, with EpochKeyStore=Ephemeral, drops every
# queued and held message).
#
# Every key but the cluster secret has a TTL, so under memory pressure `volatile-ttl` drops the
# soonest-to-expire first instead of refusing writes. Refused writes would make fail-closed limits
# deny everyone.
#
# Derived from redis.conf. Keep the security settings in sync.
# ======================================================================================
# Redis 7.4; also valid for Valkey 7.2/8.x.
#
# ---------------------------------------------------------------------------------------------------
# Authentication (ACL)
# ---------------------------------------------------------------------------------------------------
# Redis config files cannot expand environment variables, so the password is NOT in this file.
# docker-compose.yml starts Redis through a tiny shell wrapper that writes an ACL file to the
# container's tmpfs from $REDIS_PASSWORD (set in deploy/.env) and then runs:
#
#     redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
#
# The generated ACL file contains:
#
#     user default off
#     user goldfish on >$REDIS_PASSWORD ~* &* +@all -@dangerous +info
#     user healthcheck on >healthcheck -@all +ping
#
#  - "default" is disabled, so unauthenticated connections can do nothing (and protected-mode stays
#    meaningful).
#  - "goldfish" is the application user. -@dangerous removes FLUSHALL, FLUSHDB, KEYS, CONFIG, DEBUG,
#    MONITOR, SHUTDOWN, REPLICAOF, MIGRATE, RESTORE, CLIENT KILL and similar. INFO is added back because
#    StackExchange.Redis reads the server version from it to enable GETDEL and XAUTOCLAIM.
#    Everything the app uses stays allowed: EVAL/EVALSHA (the GCRA Lua script, which calls TIME, GET and
#    SET), GET, GETDEL, SET NX/PX/EX, INCR, EXPIRE, DEL.
#  - "healthcheck" can only PING. Its password is public on purpose; it exists so the container
#    healthcheck needs no secret.
#
# Running Redis without compose: put the same three lines in a file you control (chmod 600, with
# your password in place of $REDIS_PASSWORD) and pass --aclfile, or for a quick dev instance just add
# "requirepass <password>" to a copy of this file and use password=<password> in the connection string.
#
# Use a password without spaces or ";,=" characters: openssl rand -hex 32

# ---------------------------------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------------------------------
bind * -::*
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
# No TLS here: Redis is only reachable on the internal compose network. If Redis ever runs on another
# host, enable tls-port with certificates and add ssl=true to the connection string.

# ---------------------------------------------------------------------------------------------------
# Dangerous commands (defence in depth on top of the ACL above)
# ---------------------------------------------------------------------------------------------------
# Renamed to "" = removed for every user. The app never sends any of these. StackExchange.Redis
# probes CONFIG GET on connect but works without it (the connection string also maps it away with
# $CONFIG=). MONITOR is removed because it would stream every command, payloads included, to a client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command MONITOR ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MIGRATE ""
enable-debug-command no
enable-module-command no
enable-protected-configs no

# ---------------------------------------------------------------------------------------------------
# Persistence: none
# ---------------------------------------------------------------------------------------------------
# No RDB snapshots (save "") and no AOF. The AOF settings below are inert while appendonly is no. The
# container has no volume, and dir points at its tmpfs.
save ""
appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
aof-use-rdb-preamble yes
aof-load-truncated yes
dir /tmp

# ---------------------------------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------------------------------
# volatile-ttl: when full, the keys closest to expiry go first (every key here has a TTL), instead of writes
# failing and fail-closed limits refusing everyone. 256 MB is generous for this workload; tune to your host.
# Rate-limit buckets, PoW challenges, breaker state, idempotency markers (1 h) and mailbox leases.
maxmemory 256mb
maxmemory-policy volatile-ttl

# ---------------------------------------------------------------------------------------------------
# Logging and introspection: keep nothing about requests
# ---------------------------------------------------------------------------------------------------
loglevel notice
logfile ""
# The slow log records full command arguments (mailbox ids, payloads). Disabled.
slowlog-log-slower-than -1
slowlog-max-len 0
latency-monitor-threshold 0
# The ACL log keeps failed-auth entries (client address and username) in memory. Kept small.
acllog-max-len 16

databases 1
always-show-logo no
set-proc-title yes
