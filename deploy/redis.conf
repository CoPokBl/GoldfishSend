# GoldfishSend Redis configuration (Redis 7.4; also valid for Valkey 7.2/8.x).
#
# This Redis holds only short-lived state: the hot delivery queue (stream gf:q, entries live for seconds),
# one-time invite blobs and the gf:wake:* pub/sub channels. Rate limits, PoW challenges, idempotency markers
# and circuit breakers live in the non-persistent ephemeral Redis (redis-ephemeral.conf). It must never be
# reachable from outside the compose "internal" network.
#
# ---------------------------------------------------------------------------------------------------
# Authentication (ACL)
# ---------------------------------------------------------------------------------------------------
# Redis config files cannot expand environment variables, so the password is NOT in this file.
# docker-compose.yml starts Redis through a tiny shell wrapper that writes an ACL file to the
# container's tmpfs from $REDIS_PASSWORD (set in deploy/.env) and then runs:
#
#     redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
#
# The generated ACL file contains:
#
#     user default off
#     user goldfish on >$REDIS_PASSWORD ~* &* +@all -@dangerous +info +bgrewriteaof
#     user healthcheck on >healthcheck -@all +ping
#
#  - "default" is disabled, so unauthenticated connections can do nothing (and protected-mode stays
#    meaningful).
#  - "goldfish" is the application user. -@dangerous removes FLUSHALL, FLUSHDB, KEYS, CONFIG, DEBUG,
#    MONITOR, SHUTDOWN, REPLICAOF, MIGRATE, RESTORE, CLIENT KILL and similar. INFO is added back because
#    StackExchange.Redis reads the server version from it to enable GETDEL and XAUTOCLAIM.
#    BGREWRITEAOF is added back so the workers can compact the AOF every few minutes (see "Persistence").
#    Everything the app uses stays allowed: streams (XADD, XREADGROUP, XACK, XAUTOCLAIM, XDEL, XLEN,
#    XGROUP CREATE), pub/sub (PUBLISH, SUBSCRIBE), EVAL/EVALSHA (the GCRA Lua script, which calls TIME,
#    GET and SET), GET, GETDEL, SET NX/PX/EX, INCR, EXPIRE, DEL.
#  - "healthcheck" can only PING. Its password is public on purpose; it exists so the container
#    healthcheck needs no secret.
#
# Running Redis without compose: put the same three lines in a file you control (chmod 600, with
# your password in place of $REDIS_PASSWORD) and pass --aclfile, or for a quick dev instance just add
# "requirepass <password>" to a copy of this file and use password=<password> in the connection string.
#
# Use a password without spaces or ";,=" characters: openssl rand -hex 32

# ---------------------------------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------------------------------
bind * -::*
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
# No TLS here: Redis is only reachable on the internal compose network. If Redis ever runs on another
# host, enable tls-port with certificates and add ssl=true to the connection string.

# ---------------------------------------------------------------------------------------------------
# Dangerous commands (defence in depth on top of the ACL above)
# ---------------------------------------------------------------------------------------------------
# Renamed to "" = removed for every user. The app never sends any of these. StackExchange.Redis
# probes CONFIG GET on connect but works without it (the connection string also maps it away with
# $CONFIG=). MONITOR is removed because it would stream every command, payloads included, to a client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command MONITOR ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MIGRATE ""
enable-debug-command no
enable-module-command no
enable-protected-configs no

# ---------------------------------------------------------------------------------------------------
# Persistence: AOF only
# ---------------------------------------------------------------------------------------------------
# AOF keeps the queue and invites across restarts with at most ~1 s of loss. RDB snapshots
# are disabled (save "") so there is one on-disk representation instead of two: everything in here
# is short-lived, and every extra copy on disk is one more thing that outlives its TTL.
# On AOF rewrite the base file is written in RDB format (aof-use-rdb-preamble), which is fine: it
# replaces the previous base file rather than accumulating.
#
# The AOF is a log: deleted keys (queue entries, invite blobs) stay in the incr file until the
# next rewrite. A queue entry holds the mailbox id, its arrival time to the millisecond and a blob
# (sealed under the day's epoch key) carrying the message's endpoint seal key, so the log mustn't keep
# them for long. Redis by itself only rewrites once the AOF doubles past auto-aof-rewrite-min-size,
# which on a quiet server can take days, so a worker also sends BGREWRITEAOF every
# Goldfish:Messages:AofRewriteMinutes (default 5). A rewrite writes a new base file and Redis then
# deletes the old base and incr files, so a delivered message's entry leaves the AOF within minutes.
# The dataset here is small (bounded by maxmemory), so a rewrite is cheap. The workers only send it
# while INFO reports aof_enabled:1: on a Redis without an AOF, BGREWRITEAOF would write a full copy
# of the dataset to disk instead.
save ""
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
aof-use-rdb-preamble yes
aof-load-truncated yes
dir /data

# ---------------------------------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------------------------------
# noeviction: when full, writes fail and the app fails closed (mailbox creation is refused, sends fall
# back to the in-process limiter) instead of Redis silently evicting rate-limit buckets or queue entries.
# noeviction only bites with a maxmemory set. Sizing:
#   hot queue:  Goldfish:Messages:MaxStreamLength (50 000) × ~4.6 KiB per entry  ≈ 230 MiB
#   invites:    Goldfish:Invites:MaxLiveInvites (20 000) × ~4.3 KiB                ≈  85 MiB
#   overhead:   keys, AOF rewrite buffers                                           ≈ 100 MiB
# Beyond the stream bound (or on OOM), the app spills new messages to MySQL instead of failing the send,
# so this limit protects the host without losing messages. Keep the container's mem_limit about 1.5× this.
maxmemory 512mb
maxmemory-policy noeviction

# ---------------------------------------------------------------------------------------------------
# Logging and introspection: keep nothing about requests
# ---------------------------------------------------------------------------------------------------
loglevel notice
logfile ""
# The slow log records full command arguments (mailbox ids, payloads). Disabled.
slowlog-log-slower-than -1
slowlog-max-len 0
latency-monitor-threshold 0
# The ACL log keeps failed-auth entries (client address and username) in memory. Kept small.
acllog-max-len 16

databases 1
always-show-logo no
set-proc-title yes
