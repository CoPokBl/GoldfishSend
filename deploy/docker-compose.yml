# GoldfishSend production stack.
#
#   cd deploy
#   cp .env.example .env                  # domain + database/redis passwords (compose interpolation)
#   cp goldfish.env.example goldfish.env  # server keys (api + worker only)
#   chmod 600 .env goldfish.env
#   docker compose up -d --build          # or: podman compose up -d --build
#
# See server/README.md for key generation, backups and operations.
#
# Scaling out: every process is stateless and coordinates through MySQL and Redis, so
#   docker compose up -d --scale api=3 --scale worker=4
# works as-is. Caddy discovers api replicas through DNS. Workers share one Redis consumer group, so each
# message goes to one worker, and they claim held messages with SKIP LOCKED. Across hosts, run the same
# images against shared MySQL and both Redis instances.
#
# Networks
#   public    caddy + api. Not internal: caddy publishes 80/443 and reaches Let's Encrypt; the api uses
#             it for outbound verification pushes (POST /v1/mailboxes sends one synchronously).
#             The subnet is fixed so the api can trust X-Forwarded-For from it and nothing else.
#   internal  internal: true (no route to the outside world). api, worker, mysql, redis.
#             mysql and redis live only here.
#   egress    worker only. Gives the worker outbound internet to reach push servers (ntfy, FCM
#             distributors, ...) without putting it on the network caddy faces. Outbound requests are
#             SSRF-filtered in the app (private, loopback, link-local, metadata ranges are refused).
#   onion     caddy + the optional tor container (profile "onion"). Not internal, because tor needs to
#             reach the Tor network. Deliberately NOT in TrustedProxies: tor talks to Caddy's onion-only
#             listener, never to the api, so it can't spoof X-Forwarded-For.
#
# Optional onion service
#   docker compose --profile onion up -d --build
#   docker compose --profile onion exec tor cat /var/lib/tor/goldfish/hostname
#   Clients then use http://<that address>.onion with Tor turned on. See server/README.md, "Onion service".
#
# Secrets
#   Option A (default): deploy/goldfish.env, loaded with env_file into api and worker.
#   Option B: Docker secrets. Put the JSON printed by `keygen` in deploy/secrets/goldfish.json and
#   uncomment the `secrets:` blocks below. It is mounted as /app/appsettings.Production.json, which
#   ASP.NET Core loads automatically. Environment variables still win over it, so remove the
#   Goldfish__Keys__* lines from goldfish.env if you switch. See server/README.md.

name: goldfish

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Resource ceilings: a runaway or attacked container can't take the host down. Each service also sets
  # mem_limit/cpus below. Tune them to your host.
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Shared environment for api and worker. Passwords come from deploy/.env via interpolation.
x-goldfish-env: &goldfish-env
  # Maximum Pool Size × (api + worker replicas) must stay below max_connections in mysql/my.cnf (400 by default, so
  # up to 7 processes at 50). SslMode=Required encrypts but doesn't verify MySQL's self-signed certificate. That's fine
  # on this private network. If MySQL moves to another host, provision real certificates and use SslMode=VerifyFull.
  ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=goldfish;User ID=goldfish;Password=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env};SslMode=Required;Maximum Pool Size=50"
  # $$CONFIG= tells StackExchange.Redis that CONFIG is disabled on the server (see redis.conf).
  ConnectionStrings__Redis: "redis:6379,user=goldfish,password=${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env},abortConnect=false,$$CONFIG="
  # Rate limits, PoW and circuit breakers live in a separate Redis that never writes to disk (see redis-ephemeral.conf).
  ConnectionStrings__RedisEphemeral: "redis-ephemeral:6379,user=goldfish,password=${REDIS_EPHEMERAL_PASSWORD:?set REDIS_EPHEMERAL_PASSWORD in deploy/.env},abortConnect=false,$$CONFIG="
  # Never accept this server's own name as a push endpoint (loop protection).
  Goldfish__Push__BlockedHosts__0: "${GOLDFISH_DOMAIN:?set GOLDFISH_DOMAIN in deploy/.env}"
  # Defence in depth: no framework request/URL logging even if appsettings change.
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__LogLevel__System.Net.Http: "Warning"

x-goldfish-app: &goldfish-app
  <<: *hardening
  image: localhost/goldfishsend:latest
  build:
    context: ../server
    dockerfile: Dockerfile
  env_file:
    - goldfish.env
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  ulimits:
    # No core dumps: they would contain key material.
    core: 0
    nofile:
      soft: 65536
      hard: 65536
  # Option B (Docker secrets), see the header:
  # secrets:
  #   - source: goldfish_keys
  #     target: /app/appsettings.Production.json
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-ephemeral:
      condition: service_healthy

services:
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    mem_limit: 256m
    cpus: 1.0
    # Runs as root inside the container only to bind 80/443; every capability except
    # NET_BIND_SERVICE is dropped and the root filesystem is read-only.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      GOLDFISH_DOMAIN: "${GOLDFISH_DOMAIN:?set GOLDFISH_DOMAIN in deploy/.env}"
      # Caddy's fixed address on the onion network. Its onion-only listener (:8081) binds here.
      GOLDFISH_ONION_CADDY_IP: "${GOLDFISH_ONION_CADDY_IP:-172.30.251.2}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account: back this up or re-issue on loss
      - caddy_config:/config
    tmpfs:
      - /tmp:size=8m
    networks:
      public: {}
      onion:
        ipv4_address: "${GOLDFISH_ONION_CADDY_IP:-172.30.251.2}"
    depends_on:
      - api

  # Optional Tor onion service: only started with `--profile onion`. It forwards the onion's port 80 to
  # Caddy's onion-only listener, so the same routes, body limits and health-endpoint blocking apply.
  tor:
    <<: *hardening
    profiles: ["onion"]
    image: localhost/goldfishsend-tor:latest
    build:
      context: ./tor
    read_only: true
    environment:
      GOLDFISH_ONION_CADDY_IP: "${GOLDFISH_ONION_CADDY_IP:-172.30.251.2}"
    volumes:
      # Hidden-service keys: this IS the onion address. Back it up, and keep it secret.
      - tor_data:/var/lib/tor
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - onion
    depends_on:
      - caddy

  api:
    <<: *goldfish-app
    mem_limit: 512m
    cpus: 2.0
    environment:
      <<: *goldfish-env
      Goldfish__Roles: "api"
      # Trust X-Forwarded-For only from the public network, where the only other member is caddy.
      # (Docker's bridge gateway, i.e. the host itself, is also in this range; the api port is not
      # published, so only caddy and the host can reach it.)
      Goldfish__Network__TrustedProxies__0: "${GOLDFISH_PUBLIC_SUBNET:-172.30.250.0/24}"
      Goldfish__Network__TrustedProxies__1: "${GOLDFISH_PUBLIC_SUBNET6:-fd47:6f6c:6466:6973::/64}"
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "dotnet", "/app/probe/HealthProbe.dll", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *goldfish-app
    mem_limit: 512m
    cpus: 2.0
    environment:
      <<: *goldfish-env
      Goldfish__Roles: "worker"
    networks:
      - internal
      - egress
    # A worker-only process maps /healthz (liveness) but not /readyz.
    healthcheck:
      test: ["CMD", "dotnet", "/app/probe/HealthProbe.dll", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    <<: *hardening
    image: mysql:8.4
    mem_limit: 1g
    cpus: 2.0
    # The image's entrypoint works unprivileged when started as its own user, so no chown/setuid
    # capabilities are needed.
    user: mysql
    read_only: true
    command:
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=1
    environment:
      # The root password is random and printed once to the container log at first start. Nothing here needs root.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: goldfish
      MYSQL_USER: goldfish
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/goldfish.cnf:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/mysqld:size=1m,mode=1777
    networks:
      - internal
    healthcheck:
      # mysqladmin ping exits 0 whenever the server answers, even with "access denied", so it needs
      # no credentials. TCP (not the socket) so it stays unhealthy while the init-time temporary
      # server (which has networking off) is running.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    <<: *hardening
    # 7.4.6 or newer is required (CVE-2025-49844 and other Lua fixes). The app uses EVAL. The floating 7.4 tag tracks
    # the latest patch release. For reproducible deploys, pin a digest (redis:7.4-alpine@sha256:...).
    image: redis:7.4-alpine
    # maxmemory in redis.conf is 512mb. Leave room for AOF rewrites (fork, copy-on-write).
    mem_limit: 768m
    cpus: 1.0
    # Valkey works the same way: image valkey/valkey:8.1-alpine, user valkey, and replace
    # redis-server/redis-cli with valkey-server/valkey-cli (mount the config wherever you point it).
    user: redis
    read_only: true
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}"
    # Redis can't read environment variables in its config, so build the ACL file in tmpfs at start
    # (printf is a shell builtin: the password never appears in a process argument list).
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'user default off\nuser goldfish on >%s ~* &* +@all -@dangerous +info +bgrewriteaof\nuser healthcheck on >healthcheck -@all +ping\n' "$$REDIS_PASSWORD" > /tmp/users.acl
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    networks:
      - internal
    healthcheck:
      # The "healthcheck" ACL user can only PING; its password is intentionally not a secret.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass healthcheck ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Non-persistent: no volume, AOF and RDB off. Restarting it only resets rate limits.
  redis-ephemeral:
    <<: *hardening
    image: redis:7.4-alpine
    # maxmemory in redis-ephemeral.conf is 256mb.
    mem_limit: 384m
    cpus: 0.5
    user: redis
    read_only: true
    environment:
      REDIS_PASSWORD: "${REDIS_EPHEMERAL_PASSWORD:?set REDIS_EPHEMERAL_PASSWORD in deploy/.env}"
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'user default off\nuser goldfish on >%s ~* &* +@all -@dangerous +info\nuser healthcheck on >healthcheck -@all +ping\n' "$$REDIS_PASSWORD" > /tmp/users.acl
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    volumes:
      - ./redis-ephemeral.conf:/usr/local/etc/redis/redis.conf:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass healthcheck ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  public:
    driver: bridge
    # IPv6 on the public network, so IPv6 clients reach Caddy with their real address. Without it, Docker's userland
    # proxy (or rootless port forwarding) hands every IPv6 client to Caddy as the bridge gateway's IPv4 address, and
    # they all share one rate-limit bucket (the API logs a warning when it sees that). If your Docker can't do IPv6,
    # set GOLDFISH_ENABLE_IPV6=false and publish only an A record (no AAAA).
    enable_ipv6: ${GOLDFISH_ENABLE_IPV6:-true}
    ipam:
      config:
        # Change via GOLDFISH_PUBLIC_SUBNET(6) in deploy/.env if they collide with an existing network.
        # The same values feed Goldfish__Network__TrustedProxies above.
        - subnet: "${GOLDFISH_PUBLIC_SUBNET:-172.30.250.0/24}"
        - subnet: "${GOLDFISH_PUBLIC_SUBNET6:-fd47:6f6c:6466:6973::/64}"
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  onion:
    driver: bridge
    ipam:
      config:
        # Change via GOLDFISH_ONION_SUBNET (and GOLDFISH_ONION_CADDY_IP inside it) in deploy/.env if it collides.
        - subnet: "${GOLDFISH_ONION_SUBNET:-172.30.251.0/24}"

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  tor_data:

# Option B (Docker secrets), see the header. Make the file readable by UID 1654 (the image's `app`
# user), e.g. `sudo chown root:1654 secrets/goldfish.json && sudo chmod 0640 secrets/goldfish.json`
# (rootless podman: `podman unshare chown 1654:1654 secrets/goldfish.json`).
# secrets:
#   goldfish_keys:
#     file: ./secrets/goldfish.json
